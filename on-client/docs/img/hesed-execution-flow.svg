<text x="86" y="238.7" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="23" font-weight="700" fill="#2764D5">기본 실행 · PowerShell · 포트 5189</text>
<rect x="90" y="300" width="1240" height="165" rx="23" fill="#F6F9FF" stroke="#CFDDF3" stroke-width="2"/>
<rect x="120" y="327" width="60" height="56" rx="13" fill="#2764D5" stroke="#2764D5" stroke-width="2"/>
<text x="137" y="364.8" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">1</text>
<text x="210" y="367.5" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="35" font-weight="700" fill="#172B46">폴더 열기</text>
<text x="210" y="420.2" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="28" font-weight="400" fill="#52657D">파일 탐색기 D:<tspan font-family="Consolas,monospace">\</tspan>Chesed<tspan font-family="Consolas,monospace">\</tspan>on-client → 주소 표시줄에 powershell</text>
<rect x="90" y="515" width="1240" height="165" rx="23" fill="#F6F9FF" stroke="#CFDDF3" stroke-width="2"/>
<rect x="120" y="542" width="60" height="56" rx="13" fill="#2764D5" stroke="#2764D5" stroke-width="2"/>
<text x="137" y="579.8" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">2</text>
<text x="210" y="582.5" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="35" font-weight="700" fill="#172B46">버전 확인</text>
<text x="210" y="636.1" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="29" font-weight="400" fill="#52657D">node --version / git --version  (node v22~v24)</text>
<rect x="90" y="730" width="1240" height="190" rx="23" fill="#F6F9FF" stroke="#CFDDF3" stroke-width="2"/>
<rect x="120" y="757" width="60" height="56" rx="13" fill="#2764D5" stroke="#2764D5" stroke-width="2"/>
<text x="137" y="794.8" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">3</text>
<text x="210" y="797.5" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="35" font-weight="700" fill="#172B46">실행</text>
<text x="120" y="856.4" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="26" font-weight="400" fill="#172B46">powershell -NoProfile -ExecutionPolicy Bypass -File .<tspan font-family="Consolas,monospace">\</tspan>tools<tspan font-family="Consolas,monospace">\</tspan>start-alekov.ps1</text>
