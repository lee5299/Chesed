<text x="210" y="1097.5" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="35" font-weight="700" fill="#172B46">시작 신호</text>
<text x="210" y="1138.2" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="28" font-weight="400" fill="#52657D">“케셰브가 켜졌습니다. 브라우저에서</text>
<text x="210" y="1186.2" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="28" font-weight="400" fill="#52657D">http://127.0.0.1:5189/ 을 여세요.”</text>
