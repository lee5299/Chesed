<text x="210" y="1444.3" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="27" font-weight="400" fill="#52657D">메뉴: 보호 현황 · 업무 앱 · 보안 기록  (기본 실행은 「연결 없음」)</text>
