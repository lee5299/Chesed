<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2090" viewBox="0 0 2400 2090">
<title>그림 A · 실행 절차 흐름</title>
<rect width="2400" height="2090" fill="white"/>
<text x="70" y="110.2" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="58" font-weight="700" fill="#172B46">그림 A · 실행 절차 흐름</text>
<text x="74" y="174.0" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="30" font-weight="400" fill="#52657D">설명서 4장 · 폴더 열기부터 종료와 재실행까지 순서대로 진행합니다.</text>
