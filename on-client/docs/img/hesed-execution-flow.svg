<text x="210" y="1612.5" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="35" font-weight="700" fill="#172B46">종료</text>
<text x="210" y="1657.0" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="30" font-weight="400" fill="#52657D">실행 창에서 Ctrl+C</text>
