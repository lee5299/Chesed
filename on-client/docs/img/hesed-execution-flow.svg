<text x="760" y="970.9" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="21" font-weight="400" fill="#52657D">폴더 확인 → Node 버전 확인</text>
<text x="760" y="995.9" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="21" font-weight="400" fill="#52657D">→ 포트 5189 확인 → 서버 실행</text>
<text x="760" y="1020.9" font-family="Malgun Gothic,맑은 고딕,sans-serif" font-size="21" font-weight="400" fill="#52657D">→ 최대 20초 응답 확인</text>
